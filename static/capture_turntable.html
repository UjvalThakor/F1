<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Max Verstappen 360 Turntable Capture (180 Frames, Pure Alpha)</title>
  <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
  <style>
    body { margin: 0; background: #0b0e14; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; }
    h1 { margin: 0 0 16px; font-size: 22px; color: #f8fafc; }
    .layout { display: flex; gap: 24px; align-items: flex-start; }
    #api-frame { width: 480px; height: 480px; border: 1px solid #334155; border-radius: 12px; }
    .side-panel { flex: 1; min-width: 320px; }
    .progress-bar-bg { width: 100%; height: 16px; background: #1e293b; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
    .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #e10600, #ff1801, #ffd700); transition: width 0.05s; }
    .status-text { font-size: 15px; font-weight: 600; color: #38bdf8; margin-bottom: 16px; }
    .preview-box { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
    #lastFrame { width: 220px; height: 220px; border: 1px solid #475569; border-radius: 8px; background: repeating-conic-gradient(#334155 0% 25%, #1e293b 0% 50%) 50% / 20px 20px; object-fit: contain; }
    #log { font-family: monospace; font-size: 12px; color: #94a3b8; max-height: 240px; overflow-y: auto; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Max Verstappen 360 Turntable Capture (180 Frames, Pure Alpha)</h1>
  <div class="layout">
    <iframe id="api-frame" allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
    <div class="side-panel">
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
      <div id="statusText" class="status-text">Loading 3D model from Sketchfab...</div>
      <div class="preview-box">
        <img id="lastFrame" alt="Current Frame Preview" />
        <div id="frameStats" style="font-size: 13px; color: #cbd5e1; line-height: 1.6;"></div>
      </div>
      <div id="log"></div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('api-frame');
    const statusText = document.getElementById('statusText');
    const progressFill = document.getElementById('progressFill');
    const lastFrame = document.getElementById('lastFrame');
    const frameStats = document.getElementById('frameStats');
    const logBox = document.getElementById('log');

    function log(msg) {
      const p = document.createElement('div');
      p.textContent = msg;
      logBox.appendChild(p);
      logBox.scrollTop = logBox.scrollHeight;
    }

    const uid = 'f7b576c4294441478b3ffe3900360de1';
    const client = new Sketchfab('1.12.1', iframe);
    let skApi = null;

    client.init(uid, {
      autostart: 1,
      transparent: 1,
      ui_controls: 0,
      ui_infos: 0,
      ui_watermark: 0,
      ui_stop: 0,
      ui_hint: 0,
      success: function(api) {
        skApi = api;
        api.start();
        api.addEventListener('viewerready', function() {
          statusText.textContent = 'Configuring scene: Disabling post-processing for pure alpha...';
          log('Viewer ready! Disabling post-processing and setting transparent background...');
          
          api.setPostProcessing({ enable: false }, function() {
            api.setBackground({ transparent: true }, function() {
              statusText.textContent = 'Waiting 6 seconds for full 4K PBR textures to stream...';
              log('Postprocessing disabled, transparent background active. Waiting for textures...');
              setTimeout(startCaptureSequence, 6000);
            });
          });
        });
      },
      error: function(err) {
        statusText.textContent = 'Error loading 3D model.';
        log('Init error: ' + JSON.stringify(err));
      }
    });

    async function startCaptureSequence() {
      const TOTAL_FRAMES = 180;
      const target = [1097550.27, 339135.80, 5816.07];
      const radius = 104000;
      const height = 20000;
      
      const initialTheta = Math.atan2(618062.27 - 339135.80, 993979.79 - 1097550.27);
      // Start at 3/4 front view
      const angleStart = initialTheta + (3 * Math.PI) / 2 - 0.40;

      log(`Beginning capture of ${TOTAL_FRAMES} pure-alpha frames...`);

      for (let i = 1; i <= TOTAL_FRAMES; i++) {
        const progress = (i - 1) / TOTAL_FRAMES;
        const theta = angleStart - progress * 2 * Math.PI;

        const eyeX = target[0] + radius * Math.cos(theta);
        const eyeY = target[1] + radius * Math.sin(theta);
        const eyeZ = target[2] + height;

        await new Promise((resolve) => {
          skApi.setCameraLookAt([eyeX, eyeY, eyeZ], target, 0, () => {
            setTimeout(() => {
              skApi.getScreenShot(720, 720, 'image/png', async (err, b64) => {
                if (err || !b64) {
                  log(`Error on frame ${i}: ${err}`);
                  resolve();
                  return;
                }

                lastFrame.src = b64;
                const pct = Math.round((i / TOTAL_FRAMES) * 100);
                progressFill.style.width = pct + '%';
                statusText.textContent = `Capturing Frame ${i} of ${TOTAL_FRAMES} (${pct}%)`;
                frameStats.innerHTML = `Frame: <strong>${i}/${TOTAL_FRAMES}</strong><br>Angle: ${(progress * 360).toFixed(1)}°<br>Resolution: 720×720<br>Alpha: 100% Pure`;

                try {
                  const res = await fetch('/save_frame', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ frame: i, image: b64 })
                  });
                  const resData = await res.json();
                  if (i % 10 === 0 || i === 1 || i === TOTAL_FRAMES) {
                    log(`Frame ${String(i).padStart(3, '0')}/${TOTAL_FRAMES} saved (${(resData.size / 1024).toFixed(1)} KB)`);
                  }
                } catch (e) {
                  log(`Network error sending frame ${i}: ${e.message}`);
                }

                resolve();
              });
            }, 60);
          });
        });
      }

      try {
        await fetch('/done', { method: 'POST' });
      } catch (e) {}

      statusText.innerHTML = '<span style="color:#22c55e; font-size:18px;">✓ ALL 180 FRAMES SUCCESSFULLY CAPTURED!</span>';
      log('Capture pipeline complete! All 180 frames saved.');
    }
  </script>
</body>
</html>
