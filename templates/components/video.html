{% load static %}
<section class="section section-video-showcase" id="film">
  <!-- Cinematic Broadcast Header -->
  <div class="video-showcase-header">
    <h2 class="video-showcase-title">THE CHAMPIONSHIP WIN</h2>
    <p class="video-showcase-desc">
      Relive Max Verstappen’s defining championship-clinching victory at Abu Dhabi on the final lap to claim his maiden Formula 1 World Championship.
    </p>
  </div>

  <!-- Main 16:9 Windowed Video Player Container -->
  <div class="video-showcase-wrapper">
    <div class="video-showcase-media">
      <!-- High-res fallback poster -->
      <img 
        src="{% static 'images/poster_abudhabi_overtake.jpg' %}" 
        alt="Max Verstappen Final Lap Abu Dhabi 2021 Overtake" 
        class="video-showcase-bg-img"
        id="showcasePosterImg"
      >

      <!-- Active Video Element playing real Max Verstappen footage -->
      <video 
        class="video-showcase-element" 
        id="showcaseVideoEl" 
        autoplay 
        muted 
        loop 
        playsinline 
        preload="auto"
        poster="{% static 'images/poster_abudhabi_overtake.jpg' %}"
      >
        <source src="{% static 'videos/verstappen_win_abudhabi_2021.mp4' %}" type="video/mp4" id="videoSourceEl">
      </video>

      <!-- Vignette Overlay -->
      <div class="video-showcase-overlay"></div>




      <!-- Video Control Actions (Bottom Right: Sound Button Only) -->
      <div class="video-action-controls">
        <button class="btn-video-action btn-volume-toggle" id="videoVolumeBtn" aria-label="Toggle Audio Sound" title="Unmute Video Audio">
          <!-- Muted speaker icon (default) -->
          <svg class="vol-icon vol-icon-muted" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
          <!-- Active speaker icon -->
          <svg class="vol-icon vol-icon-active" style="display:none;" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
