{% load static %}
<section class="section section-video-showcase" id="film">
  <div class="video-showcase-wrapper">
    <!-- Cinematic 16:9 Windowed Video — matches reference site layout -->
    <div class="video-showcase-media">
      <img src="{% static 'images/mv_showcase_poster_4k.jpg' %}" alt="Max Verstappen 4K F1 Racing Reel" class="video-showcase-bg-img">
      <video 
        class="video-showcase-element" 
        id="showcaseVideoEl" 
        autoplay 
        muted 
        loop 
        playsinline 
        preload="auto"
        poster="{% static 'images/mv_showcase_poster_4k.jpg' %}"
      >
        <source src="{% static 'videos/f1_showcase_8k.mp4' %}" type="video/mp4">
        <source src="{% static 'videos/f1_showcase_1080p.mp4' %}" type="video/mp4">
      </video>
      <div class="video-showcase-overlay"></div>
    </div>

    <!-- Center Interactive Sound / Control Badge — centered over the entire wrapper -->
    <div class="video-showcase-controls">
      <button class="btn-video-sound-toggle" id="videoSoundToggleBtn" aria-label="Toggle Sound">
        <svg class="sound-icon sound-icon-muted" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
        <svg class="sound-icon sound-icon-active" style="display:none;" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <span class="sound-toggle-label">SOUND ON</span>
      </button>
    </div>
  </div>
</section>
