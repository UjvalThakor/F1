{% load static %}
<section class="section section-driven-progress" id="statement">
  <!-- Subtle decorative vertical grid lines (matching reference video/image) -->
  <div class="progress-vertical-grid" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="container progress-content-container">
    <!-- Floating Top-Left Track Action Card (Red Bull F1 Car on Track) -->
    <div class="progress-floating-card card-top-left" id="progressCardTopLeft">
      <div class="floating-card-frame">
        <img src="{% static 'images/statement_redbull_car.png' %}" alt="Red Bull Racing Car on Track" loading="lazy">
      </div>
    </div>

    <!-- Massive Centered Driven by Progress Typography (Max Verstappen Philosophy) -->
    <div class="progress-statement-stage" id="progressStage">
      <div class="progress-big-text">
        <div class="progress-line"><span class="text-dark">I’M NOT HERE TO BE LIKED, I’M</span></div>
        <div class="progress-line"><span class="text-dark">HERE TO </span><span class="text-yellow">WIN. TO PUSH EVERY</span></div>
        <div class="progress-line"><span class="text-yellow">LIMIT</span><span class="text-dark"> BEYOND WHAT OTHERS</span></div>
        <div class="progress-line"><span class="text-dark">THINK IS POSSIBLE. IN EVERY</span></div>
        <div class="progress-line"><span class="text-dark">CORNER, ON EVERY LAP, TO BE</span></div>
        <div class="progress-line"><span class="text-dark">SHARPER, HARDER, TO BECOME</span></div>
        <div class="progress-line"><span class="text-yellow">FASTER, RELENTLESS, UNTOUCHABLE.</span></div>
        <div class="progress-line"><span class="text-yellow">WORLD CHAMPION.</span></div>
      </div>
    </div>

    <!-- Floating Bottom-Right Driver Focus Card (Max Verstappen) -->
    <div class="progress-floating-card card-bottom-right" id="progressCardBottomRight">
      <div class="floating-card-frame">
        <img src="{% static 'images/statement_max_driver.png' %}" alt="Max Verstappen Driver Focus" loading="lazy">
      </div>
    </div>
  </div>
</section>
