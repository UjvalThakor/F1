{% load static %}
<section class="section section-driven-progress" id="statement">
  <!-- Subtle decorative vertical grid lines (matching reference video/image) -->
  <div class="progress-vertical-grid" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="container progress-content-container">
    <!-- Floating Top-Left Track Action Card (Red Bull F1 Car on Track) -->
    <div class="progress-floating-card card-top-left" id="progressCardTopLeft">
      <div class="floating-card-frame">
        <img src="{% static 'images/statement_redbull_car.png' %}" alt="Red Bull Racing Car on Track" loading="lazy">
      </div>
    </div>

    <!-- Massive Centered Driven by Progress Typography -->
    <div class="progress-statement-stage" id="progressStage">
      <div class="progress-big-text">
        <div class="progress-line"><span class="text-dark">I'M DRIVEN BY PROGRESS, BY</span></div>
        <div class="progress-line"><span class="text-dark">FINDING THE </span><span class="text-yellow">1 PERCENT OF</span></div>
        <div class="progress-line"><span class="text-yellow">IMPROVEMENT</span><span class="text-dark"> THAT MOST</span></div>
        <div class="progress-line"><span class="text-dark">PEOPLE MISS. IN EVERY</span></div>
        <div class="progress-line"><span class="text-dark">MISTAKE, IN EVERY</span></div>
        <div class="progress-line"><span class="text-dark">SESSION A CHANCE, TO BECOME</span></div>
        <div class="progress-line"><span class="text-yellow">SHARPER, MORE FOCUSED, MORE</span></div>
        <div class="progress-line"><span class="text-yellow">COMPLETE.</span></div>
      </div>
    </div>

    <!-- Floating Bottom-Right Driver Focus Card (Max Verstappen) -->
    <div class="progress-floating-card card-bottom-right" id="progressCardBottomRight">
      <div class="floating-card-frame">
        <img src="{% static 'images/statement_max_driver.png' %}" alt="Max Verstappen Driver Focus" loading="lazy">
      </div>
    </div>
  </div>
</section>
