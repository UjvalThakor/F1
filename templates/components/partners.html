{% load static %}
<section class="section section-partners-helmet" id="partners" data-helmet-section="">
  <!-- Subtle decorative vertical grid lines matching reference screenshot -->
  <div class="partners-bg-grid-lines" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="container-fluid partners-layout-container">
    <div class="partners-5col-grid">

      <!-- ================= COLUMN 1: OUTER LEFT ================= -->
      <div class="partners-col col-left-outer">
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_06.svg' %}" alt="IH R&S Hydrauliek" class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_07.svg' %}" alt="VBR Turbine Partners" class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_13.svg' %}" alt="partner accountants" class="sponsor-svg-logo" loading="lazy">
        </div>
      </div>

      <!-- ================= COLUMN 2: INNER LEFT ================= -->
      <div class="partners-col col-left-inner">
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_05.svg' %}" alt="M-TECH" class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_08.svg' %}" alt="Direct Socials" class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_11.svg' %}" alt="PROMAD" class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_14.svg' %}" alt="MULLER RACING" class="sponsor-svg-logo" loading="lazy">
        </div>
      </div>

      <!-- ================= COLUMN 3: CENTER HELMET & CTA ================= -->
      <div class="partners-col col-center-helmet">
        <!-- Spacer keeping clear area for the 3D sticky helmet -->
        <div class="helmet-placeholder-anchor" aria-hidden="true"></div>

        <!-- Signature Yellow Become Partner CTA Button -->
        <a href="#contact" class="btn-become-partner" id="btnBecomePartner">
          <span class="btn-text">BECOME PARTNER</span>
          <svg class="btn-chevron" viewBox="0 0 15 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.25 12.25L6.25 6.75L1.25 1.25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.25 12.25L13.25 6.75L8.25 1.25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <!-- ================= COLUMN 4: INNER RIGHT ================= -->
      <div class="partners-col col-right-inner">
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_09.svg' %}" alt="CJPG Technical Maintenance" class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_15.svg' %}" alt="BlueLemon24" class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_16.svg' %}" alt="{Bi}XP." class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_22.svg' %}" alt="McCafe" class="sponsor-svg-logo" loading="lazy">
        </div>
      </div>

      <!-- ================= COLUMN 5: OUTER RIGHT ================= -->
      <div class="partners-col col-right-outer">
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_01.svg' %}" alt="Featured Sponsor" class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_17.svg' %}" alt="LEGALITAS" class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_19.svg' %}" alt="youlynq.me" class="sponsor-svg-logo" loading="lazy">
        </div>
        <div class="partner-brand-slot">
          <img src="{% static 'images/sponsors/sponsor_21.svg' %}" alt="IDRUMARKON" class="sponsor-svg-logo" loading="lazy">
        </div>
      </div>

    </div>
  </div>
</section>
